<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#E9F0DC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141D18" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="art/trix-piece.png">
<link rel="apple-touch-icon" href="art/trix-piece.png">
<title>Trixdoku</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chewy&family=Nunito:wght@600;700;900&display=swap">
<style>
:root{
  --bg:#E9F0DC; --surface:#FBF7EC; --surface2:#EFE7D2;
  --ink:#27331F; --muted:#6E7B60;
  --grass:#7FA84F; --grass-deep:#4E7238;
  --barn:#C24A38; --gold:#D9A22E;
  --edge:rgba(39,51,31,.16); --rule:rgba(20,14,8,.26); --wall:#4B3722;
  --drop:rgba(39,51,31,.18); --scrim:rgba(28,38,22,.55); --veil:rgba(26,34,20,.42);
  --c1:#F08A84; --c2:#F3A65C; --c3:#EFCB54; --c4:#C3D964; --c5:#86C767;
  --c6:#58C2A6; --c7:#5CB6DE; --c8:#7A93E2; --c9:#A585DC; --c10:#DB80C4;
  --c11:#C99A82; --c12:#A3AEBA;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141D18; --surface:#1E2922; --surface2:#26332B;
    --ink:#E9F0DE; --muted:#93A388;
    --grass:#8CB95A; --grass-deep:#A7D072;
    --barn:#E0654F; --gold:#F0C560;
    --edge:rgba(233,240,222,.16); --rule:rgba(0,0,0,.34); --wall:#1C120A;
    --drop:rgba(0,0,0,.45); --scrim:rgba(8,14,10,.7); --veil:rgba(0,0,0,.55);
    --c1:#9E4A45; --c2:#A2683A; --c3:#9E8630; --c4:#7F8E3C; --c5:#53813D;
    --c6:#327B67; --c7:#35718C; --c8:#4B5C91; --c9:#69538D; --c10:#8C4F7D;
    --c11:#816152; --c12:#676F79;
  }
    :root:not([data-theme="light"]) .cell.img .tex{filter:brightness(.78) saturate(.92)}

}
:root[data-theme="dark"]{
  --bg:#141D18; --surface:#1E2922; --surface2:#26332B;
  --ink:#E9F0DE; --muted:#93A388;
  --grass:#8CB95A; --grass-deep:#A7D072;
  --barn:#E0654F; --gold:#F0C560;
  --edge:rgba(233,240,222,.16); --rule:rgba(0,0,0,.34); --wall:#1C120A;
  --drop:rgba(0,0,0,.45); --scrim:rgba(8,14,10,.7); --veil:rgba(0,0,0,.55);
  --c1:#9E4A45; --c2:#A2683A; --c3:#9E8630; --c4:#7F8E3C; --c5:#53813D;
  --c6:#327B67; --c7:#35718C; --c8:#4B5C91; --c9:#69538D; --c10:#8C4F7D;
  --c11:#816152; --c12:#676F79;
}
:root[data-theme="dark"] .cell.img .tex{filter:brightness(.78) saturate(.92)}
html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
body{
  height:100%;margin:0;background:var(--bg);color:var(--ink);
  font-family:Nunito,"Segoe UI",system-ui,-apple-system,sans-serif;font-weight:700;
  overflow:hidden;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
}
#app{position:relative;height:100%;display:flex;flex-direction:column;gap:8px;padding:0 16px 10px}

header{display:flex;align-items:center;gap:9px;padding-top:10px;flex:0 0 auto}
.brand{display:flex;align-items:center;gap:8px;min-width:0}
.logo{width:32px;height:32px;flex:0 0 auto;filter:drop-shadow(0 2px 0 var(--drop))}
.logo svg{width:100%;height:100%;display:block}
h1{font-family:Chewy,Nunito,cursive;font-weight:400;font-size:25px;margin:0;line-height:1;letter-spacing:.4px;white-space:nowrap}
.chips{display:flex;gap:7px;margin-left:auto}
.chip{background:var(--surface);border:2px solid var(--edge);border-radius:12px;padding:3px 9px;text-align:center;min-width:58px}
.chip span{display:block;font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.chip b{display:block;font-size:16px;line-height:1.15;font-variant-numeric:tabular-nums}
.hearts{display:flex;gap:3px;justify-content:center;padding:4px 0 2px}
.hearts svg{width:13px;height:13px;display:block}

.stage{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:10px}
.boardwrap{flex:0 0 auto;display:grid;place-items:center}
.board{
  display:grid;background:var(--wall);border:3px solid var(--wall);border-radius:14px;
  overflow:hidden;box-shadow:0 6px 0 var(--drop);touch-action:none;position:relative
}
.board:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.cell{position:relative;border:0 solid var(--wall);background:var(--cc)}
.cell .tex{position:absolute;inset:0;pointer-events:none;background-color:var(--cc);background-image:var(--tex);background-size:100% 100%;background-repeat:no-repeat;transition:opacity .13s ease,filter .13s ease}
.cell.img .tex{background-repeat:repeat;background-size:calc(var(--pitch,40px)*var(--span,2)) calc(var(--pitch,40px)*var(--span,2));background-position:calc(var(--c,0)*var(--pitch,40px)*-1) calc(var(--r,0)*var(--pitch,40px)*-1)}
.cell .thin{position:absolute;inset:0;pointer-events:none;box-shadow:inset 1px 1px 0 var(--rule)}
.cell.t0 .thin{box-shadow:inset 1px 0 0 var(--rule)}
.cell.l0 .thin{box-shadow:inset 0 1px 0 var(--rule)}
.cell.t0.l0 .thin{box-shadow:none}
.cell svg{position:absolute;inset:8%;width:84%;height:84%;display:block}
.cell .veil{position:absolute;inset:0;background:var(--veil);opacity:0;transition:opacity .12s}
.cell.bad::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 0 3px var(--barn);border-radius:2px}
.cell.cur::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 0 3px var(--gold);border-radius:2px}
@keyframes wobble{0%,100%{transform:rotate(0)}25%{transform:rotate(-7deg)}75%{transform:rotate(7deg)}}
.cell.shake svg{animation:wobble .28s ease-in-out 2}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.cell.tip::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 0 3px var(--gold);animation:pulse .5s ease-in-out 4}

.controls{flex:0 0 auto;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center}
.seg{display:flex;background:var(--surface2);border:2px solid var(--edge);border-radius:13px;padding:2px;gap:2px}
.seg button{
  font-family:inherit;font-weight:900;font-size:13px;border:0;background:none;color:var(--muted);
  padding:7px 11px;border-radius:10px;cursor:pointer;font-variant-numeric:tabular-nums
}
.seg button.on{background:var(--grass);color:#16210F}
.btns{display:flex;gap:7px}
.btn{
  font-family:inherit;font-weight:900;font-size:13px;border-radius:13px;padding:9px 13px;cursor:pointer;
  border:2px solid var(--edge);background:var(--surface);color:var(--ink)
}
.btn[disabled]{opacity:.42;cursor:default}
.btn.primary{background:var(--grass);border-color:var(--grass-deep);color:#16210F}
.btn:not([disabled]):active{transform:translateY(1px)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

.footline{flex:0 0 auto;margin:0;text-align:center;font-size:11.5px;font-weight:600;color:var(--muted);line-height:1.4}
.footline b{color:var(--ink)}

.toast{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:50;
  background:var(--surface);border:2px solid var(--edge);border-radius:14px;padding:9px 14px;
  font-size:13px;box-shadow:0 6px 0 var(--drop);pointer-events:none;max-width:82%;text-align:center
}
@keyframes fade{0%{opacity:0;transform:translate(-50%,-40%)}12%{opacity:1;transform:translate(-50%,-50%)}80%{opacity:1}100%{opacity:0}}
.toast.show{animation:fade 2s ease-out forwards}

[hidden]{display:none!important}
.overlay{position:absolute;inset:0;z-index:70;display:grid;place-items:center;background:var(--scrim);padding:20px}
.card{background:var(--surface);border:3px solid var(--edge);border-radius:22px;padding:22px 20px;max-width:340px;width:100%;text-align:center;box-shadow:0 10px 0 var(--drop)}
.card h2{font-family:Chewy,cursive;font-weight:400;font-size:27px;margin:0 0 8px}
.card p{margin:0 0 14px;font-size:13.5px;font-weight:600;color:var(--muted);line-height:1.55}
.bigtime{font-family:Chewy,cursive;font-size:48px;line-height:1;color:var(--barn);font-variant-numeric:tabular-nums}
.sub{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:14px}
.acts{display:flex;gap:9px;justify-content:center;flex-wrap:wrap}
.rules{text-align:left;font-size:13px;font-weight:600;color:var(--ink);margin:0 0 14px;padding-left:18px;line-height:1.6}
.rules li{margin-bottom:5px}
.card.wide{max-width:400px}
.tot{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:0 0 12px}
.tot span{background:var(--surface2);border:2px solid var(--edge);border-radius:10px;padding:3px 9px;font-size:12px}
.tot b{font-family:Chewy,cursive;font-weight:400;font-size:15px;letter-spacing:1px;margin-right:4px}
.lvpick{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:0 0 10px;max-height:104px;overflow:auto}
.lvchip{font-family:inherit;font-weight:900;font-size:13px;min-width:36px;padding:5px 8px;border-radius:10px;
  border:2px solid var(--edge);background:var(--surface2);color:var(--muted);cursor:pointer}
.lvchip.on{background:var(--grass);border-color:var(--grass-deep);color:#fff}
.lvhead{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);
  text-align:left;margin:0 0 4px;padding:0 4px}
.note{font-size:11.5px;font-weight:600;color:var(--muted);margin:10px 0 14px;line-height:1.4}
.recs{max-height:44vh;overflow:auto;margin:0 0 14px;text-align:left}
.rec{display:grid;grid-template-columns:34px 1fr auto auto;gap:8px;align-items:baseline;
  padding:5px 4px;border-bottom:1px solid var(--edge);font-size:13px}
.rec span{color:var(--muted);font-size:11px}
.rec b{font-family:Chewy,cursive;font-weight:400;font-size:17px;letter-spacing:2px}
.rec i{font-style:normal;color:var(--muted);font-variant-numeric:tabular-nums}
.rec em{font-style:normal;font-weight:900;min-width:52px;text-align:right;font-variant-numeric:tabular-nums}
.score{font-family:Chewy,cursive;font-size:30px;line-height:1;color:var(--grass-deep);margin:2px 0 0}
.ini{display:flex;gap:8px;justify-content:center;align-items:center;margin:0 0 14px}
.ini input{font-family:Chewy,cursive;font-size:30px;letter-spacing:9px;text-align:center;width:130px;
  padding:6px 0 6px 9px;border-radius:12px;border:2px solid var(--edge);background:var(--surface2);color:var(--ink);text-transform:uppercase}
.levels{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:2px 0 14px;max-height:52vh;overflow:auto;padding:2px}
.lv{aspect-ratio:1;border-radius:11px;border:2px solid var(--edge);background:var(--surface2);color:var(--ink);
  font-family:inherit;font-weight:900;font-size:15px;line-height:1;cursor:pointer;padding:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.lv.done{background:var(--grass);border-color:var(--grass-deep);color:#16210F}
.lv[disabled]{opacity:.34;cursor:default}
.lv i{font-style:normal;font-size:9px;letter-spacing:.5px;opacity:.85}
.me{width:36px;height:36px;border-radius:50%;padding:0;border:2px solid var(--edge);background:var(--surface);
  cursor:pointer;flex:0 0 auto;display:grid;place-items:center;overflow:hidden}
.ava{display:grid;place-items:center;width:32px;height:32px;border-radius:50%;overflow:hidden;
  background:var(--surface2);flex:0 0 auto}
.ava img{width:100%;height:100%;object-fit:cover;display:block}
.ava b{font-weight:400;font-size:17px;line-height:1}
.ava u{text-decoration:none;font-family:Chewy,cursive;font-size:13px;letter-spacing:1px;color:#1d2a16}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .ava u{color:#F2F7EC}}
.ava.big{width:66px;height:66px}
.ava.big b{font-size:34px}
.ava.big u{font-size:24px;letter-spacing:2px}
.ava.sm{width:25px;height:25px}
.ava.sm b{font-size:13px}
.ava.sm u{font-size:10px;letter-spacing:.5px}
.prof{display:flex;gap:12px;align-items:center;text-align:left;margin:0 0 14px}
.pmeta{min-width:0}
.pmeta b{font-size:13px;color:var(--muted);font-weight:800}
.pmeta p{margin:3px 0 0;font-size:12.5px;font-weight:600;color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:0 0 14px}
.stat{background:var(--surface2);border:2px solid var(--edge);border-radius:12px;padding:5px 2px}
.stat b{display:block;font-family:Chewy,cursive;font-weight:400;font-size:19px;line-height:1.15}
.stat span{display:block;font-size:8.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px;max-height:26vh;overflow:auto}
.badge{display:flex;align-items:center;gap:5px;background:var(--surface2);border:2px solid var(--edge);
  border-radius:11px;padding:4px 8px;font-size:11.5px;font-weight:800;opacity:.4}
.badge.on{opacity:1;background:var(--grass);border-color:var(--grass-deep);color:#16210F}
.badge b{font-weight:400;font-size:14px}
.form{display:flex;flex-direction:column;gap:8px;margin:0 0 12px}
.card input[type=text],.card input[type=password]{font-family:inherit;font-weight:700;font-size:15px;
  padding:9px 11px;border-radius:12px;border:2px solid var(--edge);background:var(--surface2);color:var(--ink);
  -webkit-user-select:text;user-select:text;width:100%;box-sizing:border-box}
.card input::placeholder{color:var(--muted);font-weight:600}
.tabs{display:flex;gap:6px;justify-content:center;margin:0 0 12px}
.err{color:var(--barn);font-size:12.5px;font-weight:800;margin:0 0 12px;line-height:1.4}
.ok{color:var(--grass-deep);font-size:12.5px;font-weight:800;margin:0 0 12px}
.avpick{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;margin:0 0 12px}
.avopt{padding:3px;border-radius:50%;border:2px solid var(--edge);background:var(--surface);cursor:pointer;line-height:0}
.avopt.on{border-color:var(--grass-deep);background:var(--grass)}
.linkbtn{font-family:inherit;font-weight:800;font-size:12px;color:var(--muted);background:none;border:0;
  text-decoration:underline;cursor:pointer;padding:2px 4px}
.who{display:flex;align-items:center;gap:6px;min-width:0}
.who b{font-family:Chewy,cursive;font-weight:400;font-size:16px;letter-spacing:1px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* The profile button is a fourth thing in a header that was already full, so
   the chrome shrinks earlier than it used to and the title gives way first. */
h1{overflow:hidden;text-overflow:ellipsis}
@media (max-width:439px){
  h1{font-size:20px}
  .logo{width:28px;height:28px}
  .chip{min-width:46px;padding:3px 6px}
  .chip b{font-size:14px}
  header{gap:6px}
  .me{width:30px;height:30px}
  .me .ava{width:26px;height:26px}
  .me .ava b{font-size:14px}
  .me .ava u{font-size:11px;letter-spacing:.5px}
}
@media (max-width:379px){
  h1{font-size:20px}
  .logo{width:28px;height:28px}
  .chip{min-width:46px;padding:3px 6px}
  .chip b{font-size:14px}
  header{gap:6px}
}
@media (prefers-reduced-motion: reduce){
  .cell.shake svg,.cell.tip::after{animation:none}
  .toast.show{animation-duration:1.2s}
}
</style>

</head>
<body>
<div id="app">
  <header>
    <div class="brand"><span class="logo" id="logo"></span><h1>Trixdoku</h1></div>
    <div class="chips">
      <div class="chip"><span>Lives</span><div class="hearts" id="hearts"></div></div>
      <div class="chip"><span>Time</span><b id="time">0:00</b></div>
      <div class="chip"><span>Best</span><b id="best">—</b></div>
    </div>
    <button class="me" id="meBtn" aria-label="Your profile"></button>
  </header>

  <main class="stage">
  <div class="boardwrap"><div class="board" id="board" tabindex="0" role="application" aria-label="Trixdoku puzzle"></div></div>

  <div class="controls">
    <div class="seg" id="sizes" role="group" aria-label="Board size"></div>
    <div class="btns">
      <button class="btn" id="undo" disabled>Undo</button>
      <button class="btn" id="hint">Hint</button>
      <button class="btn" id="levelsBtn">Levels</button>
      <button class="btn primary" id="newBtn">New</button>
    </div>
  </div>
  <p class="footline" id="foot">Tap to rule a square out, hold or double-tap to place <b>Trix</b>. Drag to mark a run.</p>
  </main>

  <div class="toast" id="toast" hidden></div>
  <div class="overlay" id="overlay" hidden><div class="card" id="card"></div></div>
</div>

<script>
(function(){
"use strict";
var $=function(s){return document.querySelector(s)};
var D=[[-1,0],[1,0],[0,-1],[0,1]];

/* ---------------- art ---------------- */
function cowSVG(){
  return '<svg viewBox="0 0 100 100" aria-hidden="true"><image href="art/trix-piece.png" x="0" y="0" width="100" height="100" preserveAspectRatio="xMidYMid meet"/></svg>';
}
function patSVG(){
  return '<svg viewBox="0 0 100 100" aria-hidden="true"><g stroke="rgba(22,18,12,.5)" stroke-width="13" stroke-linecap="round"><path d="M31 31 L69 69"/><path d="M69 31 L31 69"/></g></svg>';
}
function svgURI(inner){
  return 'url("data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40">'+inner+'</svg>')+'")';
}
function wave(y){return "M-3 "+y+" q5 -4 10 0 t10 0 t10 0 t10 0 t10 0"}
function rnd(seed){
  var a=seed||1;
  return function(){a=(a*1103515245+12345)&0x7FFFFFFF;return a/0x7FFFFFFF};
}
function terrainTex(kind,v){
  var R=rnd(kind*977+v*131+17),s="",i,k,x,y,h,lean,t;
  if(kind<2){
    var o=v*4;
    s+='<path d="'+wave(7+o)+'" fill="none" stroke="#fff" stroke-opacity=".36" stroke-width="2.4" stroke-linecap="round"/>';
    s+='<path d="'+wave(19+o)+'" fill="none" stroke="#fff" stroke-opacity=".22" stroke-width="2.1" stroke-linecap="round"/>';
    s+='<path d="'+wave(31+o)+'" fill="none" stroke="#000" stroke-opacity=".13" stroke-width="2.1" stroke-linecap="round"/>';
    s+='<path d="'+wave(40-o)+'" fill="none" stroke="#fff" stroke-opacity=".18" stroke-width="1.8" stroke-linecap="round"/>';
  }else if(kind<5||kind===10){
    var hay=(kind===10);
    var tones=hay?[["#000",".24","1.5"],["#fff",".30","1.4"],["#fff",".58","1.2"]]
                 :[["#000",".20","1.7"],["#fff",".17","1.5"],["#fff",".42","1.3"]];
    var count=hay?44:50;
    for(i=0;i<count;i++){
      x=R()*46-3;y=R()*48-4;
      h=(hay?8:5.5)+R()*(hay?7:5.5);
      lean=(R()-.5)*(hay?7:5);
      t=tones[i%3];
      s+='<path d="M'+x.toFixed(1)+' '+y.toFixed(1)+' q'+(lean*0.35).toFixed(1)+' '+(-h*0.6).toFixed(1)+
         ' '+lean.toFixed(1)+' '+(-h).toFixed(1)+'" fill="none" stroke="'+t[0]+'" stroke-opacity="'+t[1]+
         '" stroke-width="'+t[2]+'" stroke-linecap="round"/>';
    }
    if(kind===2)
      s+='<circle cx="'+(21+v*4)+'" cy="9" r="1.8" fill="#fff" fill-opacity=".55"/>'+
         '<circle cx="'+(34+v*2)+'" cy="30" r="1.5" fill="#fff" fill-opacity=".45"/>';
  }else if(kind<8){
    for(i=0;i<3;i++)
      s+='<ellipse cx="'+(R()*40).toFixed(1)+'" cy="'+(R()*40).toFixed(1)+'" rx="'+(7+R()*6).toFixed(1)+
         '" ry="'+(4+R()*4).toFixed(1)+'" fill="#000" fill-opacity=".10"/>';
    for(i=0;i<14;i++){
      x=3+R()*34;y=3+R()*34;
      var rad=1.6+R()*1.9,pts="";
      for(k=0;k<5;k++){
        var ang=(k/5)*6.2832+R()*0.55,pr=rad*(0.7+R()*0.6);
        pts+=(x+Math.cos(ang)*pr).toFixed(1)+","+(y+Math.sin(ang)*pr*0.85).toFixed(1)+" ";
      }
      s+='<polygon points="'+pts+'" fill="#fff" fill-opacity=".26" stroke="#000" stroke-opacity=".34" stroke-width="1.1" stroke-linejoin="round"/>';
    }

function par(size){return 12+Math.round(size*size*1.2)}

               '<button class="linkbtn" data-act="me">Create one</button></p>':'')+
        '<p>'+(last?"That is the last level. Free play never runs out.":(st<3?"Beat "+fmt(par(n))+" for three stars.":"Nothing faster to ask for."))+'</p>'+
        '<div class="acts">'+(last?'':'<button class="btn primary" data-act="next">Next level</button>')+

function hint(){
  if(won||lost) return;
  var i,wrong=-1;
  for(i=0;i<n*n;i++) if(marks[i]===2&&sol[(i/n)|0]!==i%n){wrong=i;break}
  if(wrong>=0){

    setTimeout(function(){cellEls[wrong].classList.remove("tip")},2100);
    toast("That one is in the wrong field.");

  }
  var open=[];
  for(var r=0;r<n;r++){var j=r*n+sol[r];if(marks[j]!==2) open.push(j)}

  var pick=open[Math.floor(Math.random()*open.length)];

var FAMILY=[0,0,1,1,2,2,3,3,4,4,5,6];
var SKIP={};
function pickTerrains(n,reg){
  var adj=[],g,h,r,c,i,p,q,k;
  for(g=0;g<n;g++)adj.push({});
  for(r=0;r<n;r++)for(c=0;c<n;c++){
    i=r*n+c;
    if(c+1<n&&reg[i]!==reg[i+1]){adj[reg[i]][reg[i+1]]=1;adj[reg[i+1]][reg[i]]=1;}
    if(r+1<n&&reg[i]!==reg[i+n]){adj[reg[i]][reg[i+n]]=1;adj[reg[i+n]][reg[i]]=1;}
  }
  var best=null,bestBad=1e9,t;
  for(t=0;t<40;t++){
    var pool=shuffle(Array.from({length:TERRAINS},function(_,x){return x}).filter(function(x){return !SKIP[x];}));
    var out=new Array(n).fill(-1),used={},bad=0;
    for(g=0;g<n;g++){
      var pick=-1;
      for(p=0;p<pool.length;p++){
        k=pool[p];if(used[k])continue;
        var clash=false;
        for(h in adj[g])if(out[h]>=0&&FAMILY[out[h]]===FAMILY[k]){clash=true;break;}
        if(!clash){pick=k;break;}
      }
      if(pick<0){for(q=0;q<pool.length;q++)if(!used[pool[q]]){pick=pool[q];break;}bad++;}
      used[pick]=1;out[g]=pick;
    }
    if(bad<bestBad){bestBad=bad;best=out;if(!bad)break;}
  }
  return best;
}

    marks=new Array(n*n).fill(0);undoStack=[];elapsed=0;hints=0;won=false;lost=false;strikes=0;cursor=-1;

/* ---------------- badges ---------------- */
function badges(){
  var st=prog.star||{},cl=prog.clean||{},done=0,three=0,big=0,k;
  for(k in st){done++;if(st[k]>=3)three++;if(LEVELS[k]&&LEVELS[k].n>=10)big++}
  var clean=Object.keys(cl).length,firsts=(MESTATS&&MESTATS.firsts)||0;
  return [
    {i:"\ud83c\udf31",n:"First one",d:"Finish a level",got:done>=1},
    {i:"\ud83d\udd1f",n:"Ten down",d:"Finish ten levels",got:done>=10},
    {i:"\ud83c\udfc3",n:"Regular",d:"Finish forty levels",got:done>=40},
    {i:"\ud83c\udfc1",n:"The lot",d:"Finish every level",got:done>=LEVELS.length},
    {i:"\u2b50",n:"Three stars",d:"Three stars on a level",got:three>=1},
    {i:"\u2728",n:"Star collector",d:"Three stars on twenty-five levels",got:three>=25},
    {i:"\ud83d\udee1",n:"No mistakes",d:"Finish a level without losing a life",got:clean>=1},
    {i:"\ud83e\udde0",n:"Steady hand",d:"Ten levels without losing a life",got:clean>=10},
    {i:"\ud83d\udd0d",n:"Big board",d:"Finish a 10x10 or bigger",got:big>=1},
    {i:"\ud83c\udfc6",n:"Top score",d:"Hold the best score on a level",got:firsts>=1},
    {i:"\ud83d\udc51",n:"Board hog",d:"Best score on five levels",got:firsts>=5}
  ];
}

/* ---------------- cards ---------------- */
function statCell(v,label){return '<div class="stat"><b>'+v+'</b><span>'+label+'</span></div>'}
function accountCard(msg,quiet){
  if(!ME) return signCard("in","");
  var s=MESTATS||{total:0,firsts:0};
  var st=prog.star||{},done=0,stars=0,k;
  for(k in st){done++;stars+=st[k]}
  var list=badges(),got=0,i;
  for(i=0;i<list.length;i++) if(list[i].got) got++;
  var h='<h2 id="profCard">'+esc(ME.name)+'</h2>'+
    '<div class="prof">'+avaHTML(ME.avatar,ME.ini,"big")+
      '<div class="pmeta"><b>@'+esc(ME.handle)+'</b>'+(ME.bio?'<p>'+esc(ME.bio)+'</p>':'')+'</div></div>'+
    '<div class="stats">'+statCell(done,"levels")+statCell(stars,"stars")+
      statCell(s.total||0,"points")+statCell(s.firsts||0,"top scores")+'</div>'+
    (msg?'<p class="ok">'+esc(msg)+'</p>':'')+
    '<div class="lvhead">Badges '+got+' of '+list.length+'</div><div class="badges">';
  for(i=0;i<list.length;i++)
    h+='<span class="badge'+(list[i].got?" on":"")+'" title="'+esc(list[i].d)+'"><b>'+list[i].i+'</b>'+esc(list[i].n)+'</span>';
  h+='</div><div class="acts"><button class="btn" data-act="editprof">Edit profile</button>'+
     '<button class="btn" data-act="records">Records</button>'+
     '<button class="btn primary" data-act="close">Back</button></div>'+
     '<p class="note"><button class="linkbtn" data-act="signout">Sign out</button></p>';
  modal(h,true);
  // The points and top scores come from the server, and a level finished since
  // the page loaded has moved them. Fetch once and redraw if anything changed.
  if(!quiet) api("/api/me").then(function(j){
    if(!$("#profCard")||!j.user) return;
    var was=JSON.stringify(MESTATS);
    setMe(j);
    if(JSON.stringify(MESTATS)!==was) accountCard(msg,true);
  }).catch(function(){});
}
function signCard(mode,err){
  var up=mode==="up";
  var h='<h2>'+(up?"New player":"Welcome back")+'</h2>'+
    '<div class="tabs"><button class="lvchip'+(up?"":" on")+'" data-act="tabin">Sign in</button>'+
    '<button class="lvchip'+(up?" on":"")+'" data-act="tabup">Create account</button></div>'+
    '<div class="form">'+
    '<input type="text" id="uHandle" placeholder="username" autocomplete="username" '+
      'autocapitalize="none" autocorrect="off" spellcheck="false" maxlength="20">'+
    '<input type="password" id="uPass" placeholder="password" maxlength="200" '+
      'autocomplete="'+(up?"new-password":"current-password")+'">'+
    (up?'<input type="text" id="uName" placeholder="name on the board" maxlength="24" autocomplete="nickname">':'')+
    '</div>'+
    (err?'<p class="err">'+esc(err)+'</p>':
      '<p class="note">'+(up?"Your username and password are all this keeps. No email, nothing else."
        :"Your levels, stars and scores follow your account to any phone.")+'</p>')+
    '<div class="acts"><button class="btn" data-act="close">Not now</button>'+
    '<button class="btn primary" data-act="'+(up?"dosignup":"dosignin")+'">'+(up?"Create account":"Sign in")+'</button></div>';
  modal(h);
  var f=$("#uHandle");
  if(f){
    setTimeout(function(){try{f.focus()}catch(e){}},60);
    f.oninput=function(){this.value=this.value.toLowerCase().replace(/[^a-z0-9_]/g,"")};
    var p=$("#uPass");
    if(p) p.onkeydown=function(e){if(e.key==="Enter") doSign(up)};
  }
}
function editCard(msg,err){
  var h='<h2>Your profile</h2><div class="avpick">';
  var i,a;
  for(i=0;i<PRESETS.length;i++){
    a="p:"+PRESETS[i];
    h+='<button class="avopt'+(ME.avatar===a?" on":"")+'" data-act="avpick" data-av="'+a+'">'+avaHTML(a,ME.ini,"")+'</button>';
  }
  h+='</div><div class="form">'+
    '<input type="text" id="pName" placeholder="name on the board" maxlength="24" value="'+esc(ME.name)+'">'+
    '<input type="text" id="pIni" placeholder="AAA" maxlength="3" value="'+esc(ME.ini)+'">'+
    '<input type="text" id="pBio" placeholder="a line about you" maxlength="140" value="'+esc(ME.bio||"")+'">'+
    '</div>'+
    (err?'<p class="err">'+esc(err)+'</p>':msg?'<p class="ok">'+esc(msg)+'</p>':
      '<p class="note">The initials show on small score rows. Pictures stay under 2MB and are squared off.</p>')+
    '<input type="file" id="avFile" accept="image/png,image/jpeg,image/webp,image/gif" hidden>'+
    '<div class="acts"><button class="btn" data-act="pickfile">Upload a picture</button>'+
    '<button class="btn primary" data-act="saveprof">Save</button></div>'+
    '<p class="note"><button class="linkbtn" data-act="pwcard">Change password</button> &middot; '+
    '<button class="linkbtn" data-act="me">Back to profile</button></p>';
  modal(h,true);
  var fi=$("#avFile");
  if(fi) fi.onchange=function(){uploadAvatar(fi.files&&fi.files[0])};
}
function passCard(err,msg){
  modal('<h2>Change password</h2><div class="form">'+
    '<input type="password" id="pwOld" placeholder="current password" autocomplete="current-password">'+
    '<input type="password" id="pwNew" placeholder="new password" autocomplete="new-password">'+
    '</div>'+
    (err?'<p class="err">'+esc(err)+'</p>':msg?'<p class="ok">'+esc(msg)+'</p>':
      '<p class="note">Changing it signs out any other phone you are on.</p>')+
    '<div class="acts"><button class="btn" data-act="editprof">Back</button>'+
    '<button class="btn primary" data-act="dopw">Change it</button></div>');
}

/* ---------------- actions ---------------- */
function val(id){var e=$(id);return e?e.value:""}
function doSign(up){
  var handle=val("#uHandle").trim(),pass=val("#uPass");
  if(handle.length<3) return signCard(up?"up":"in","Usernames are at least three characters.");
  if(pass.length<1) return signCard(up?"up":"in","Put your password in.");
  var body=up?{handle:handle,pass:pass,name:val("#uName").trim()||handle,ini:(val("#uName")||handle).slice(0,3)}
             :{handle:handle,pass:pass};
  api(up?"/api/signup":"/api/login",body).then(function(j){
    setMe(j);
    pullProgress();
    accountCard(up?"Profile created. Add a picture whenever you like.":"Signed in.");
  }).catch(function(e){signCard(up?"up":"in",e.message)});
}
function saveProfile(){
  api("/api/profile",{name:val("#pName").trim(),ini:val("#pIni"),bio:val("#pBio").trim()})
    .then(function(j){setMe(j);prog.ini=ME.ini;save();accountCard("Profile saved.")})
    .catch(function(e){editCard("",e.message)});
}
function pickAvatar(a){
  api("/api/profile",{avatar:a}).then(function(j){setMe(j);editCard("Avatar set.")})
    .catch(function(e){editCard("",e.message)});
}
// Photos come off a phone camera at several thousand pixels. Square and shrink
// them here, so what goes up is a small PNG whatever the player picked.
function uploadAvatar(file){
  if(!file) return;
  if(file.size>20*1024*1024) return editCard("","That picture is too big.");
  var url=URL.createObjectURL(file),img=new Image();
  img.onload=function(){
    var m=256,side=Math.min(img.width,img.height),c=document.createElement("canvas");
    c.width=c.height=Math.min(m,side)||m;
    var x=c.getContext("2d");
    x.drawImage(img,(img.width-side)/2,(img.height-side)/2,side,side,0,0,c.width,c.height);
    URL.revokeObjectURL(url);
    c.toBlob(function(bl){
      if(!bl) return editCard("","Could not read that picture.");
      fetch("/api/avatar",{method:"POST",credentials:"same-origin",
        headers:{"content-type":"image/png"},body:bl})
        .then(function(r){return r.json().catch(function(){return {}}).then(function(j){
          if(!r.ok) throw new Error(j.error||"Could not upload that picture.");
          return j})})
        .then(function(j){setMe(j);editCard("Picture saved.")})
        .catch(function(e){editCard("",e.message)});
    },"image/png");
  };
  img.onerror=function(){URL.revokeObjectURL(url);editCard("","Could not read that picture.")};
  img.src=url;
}
function signOut(){
  api("/api/logout",{}).then(function(){setMe(null);hideModal();toast("Signed out.")}).catch(function(){});
}

/* ---------------- progress sync ---------------- */
function progBody(){
  return {star:prog.star||{},best:prog.best||{},rec:prog.rec||{},clean:prog.clean||{},ini:prog.ini||""};
}
function mergeProg(r){
  if(!r) return false;
  var ch=false,k;
  prog.star=prog.star||{};prog.best=prog.best||{};prog.rec=prog.rec||{};prog.clean=prog.clean||{};
  for(k in (r.star||{})) if(!prog.star[k]||r.star[k]>prog.star[k]){prog.star[k]=r.star[k];ch=true}
  for(k in (r.best||{})) if(!prog.best[k]||r.best[k]<prog.best[k]){prog.best[k]=r.best[k];ch=true}
  for(k in (r.rec||{})) if(r.rec[k]&&(!prog.rec[k]||r.rec[k].sc>prog.rec[k].sc)){prog.rec[k]=r.rec[k];ch=true}
  for(k in (r.clean||{})) if(!prog.clean[k]){prog.clean[k]=1;ch=true}
  return ch;
}
function pullProgress(){
  if(!ME) return;
  api("/api/progress?game="+encodeURIComponent(GAME)).then(function(j){
    var ch=mergeProg(j&&j.data);
    if(ME.ini) prog.ini=ME.ini;
    if(ch){save();paintChrome();paint();if($("#profCard")) accountCard("",true)}
    pushProgress(true);
  }).catch(function(){});
}
function pushProgress(soon){
  if(!ME||!onWeb()) return;
  var s=JSON.stringify(progBody());
  if(s===lastPush) return;
  clearTimeout(syncT);
  syncT=setTimeout(function(){
    lastPush=s;
    api("/api/progress",{game:GAME,data:JSON.parse(s)}).catch(function(){lastPush=""});
  },soon?80:4000);
}

/* ---------------- persistence ---------------- */
function save(){
  try{
    localStorage.setItem(KEY,JSON.stringify({
      n:n,reg:reg,sol:sol,marks:marks,colorOf:colorOf,elapsed:elapsed,
      hints:hints,won:won,lost:lost,strikes:strikes,stats:stats,
      mode:mode,level:level,prog:prog
    }));
  }catch(e){}
  pushProgress();
}
function load(){
  try{
    var s=JSON.parse(localStorage.getItem(KEY)||"null");
    if(!s||!s.reg||!s.sol||s.reg.length!==s.n*s.n) return null;
    return s;
  }catch(e){return null}
}

/* ---------------- modal ---------------- */
function modal(html,wide){var c=$("#card");c.className="card"+(wide?" wide":"");c.innerHTML=html;$("#overlay").hidden=false}
function hideModal(){$("#overlay").hidden=true}
$("#overlay").addEventListener("click",function(e){
  var lb=e.target.closest("[data-lv]");
  if(lb&&!lb.disabled){startLevel(lb.dataset.lv|0);return}
  var b=e.target.closest("[data-act]");if(!b)return;
  var a=b.dataset.act;
  if(a==="new") newPuzzle();
  else if(a==="next") startLevel(level+1);
  else if(a==="levels") levelPicker();
  else if(a==="records") openBoard();
  else if(a==="board"){boardLv=b.dataset.bl|0;leaderboard();return}
  else if(a==="saveini"){
    var el=$("#iniIn"),v=cleanIni(el?el.value:"");
    if(v.length<1){if(el)el.focus();return}
    if(pending){pending.ini=v;saveRecord(pending.k,{ini:v,sc:pending.sc,t:pending.t,at:Date.now()});pending=null}
    if(el){el.parentNode.innerHTML='<span class="sub" style="margin:0">saved as '+v+'</span>'}
    return;
  }
  else if(a==="free"){hideModal();newPuzzle();}
  else if(a==="restart") restart();
  else if(a==="me"){accountCard();return}
  else if(a==="tabin"){signCard("in","");return}
  else if(a==="tabup"){signCard("up","");return}
  else if(a==="dosignin"){doSign(false);return}
  else if(a==="dosignup"){doSign(true);return}
  else if(a==="editprof"){editCard("","");return}
  else if(a==="saveprof"){saveProfile();return}
  else if(a==="avpick"){pickAvatar(b.dataset.av);return}
  else if(a==="pickfile"){var fi=$("#avFile");if(fi)fi.click();return}
  else if(a==="pwcard"){passCard("","");return}
  else if(a==="dopw"){
    api("/api/password",{old:val("#pwOld"),pass:val("#pwNew")})
      .then(function(){passCard("","Password changed.")})
      .catch(function(e){passCard(e.message,"")});
    return;
  }
  else if(a==="signout"){signOut();return}
  else if(a==="close") hideModal();
});

/* ---------------- controls ---------------- */
function paintSizes(){
  var el=$("#sizes");el.innerHTML="";
  SIZES.forEach(function(s){
    var b=document.createElement("button");
    b.textContent=s;b.className=s===n?"on":"";
    b.setAttribute("aria-label",s+" by "+s+" board");
    b.onclick=function(){if(s!==n) newPuzzle(s)};
    el.appendChild(b);
  });
}
$("#undo").onclick=undo;
$("#hint").onclick=hint;
$("#levelsBtn").onclick=levelPicker;
$("#newBtn").onclick=function(){
  if(mode==="level"){restart();return}
  
  if(won||lost){newPuzzle();return}
  modal('<h2>Leave this board?</h2><p>You are '+cowList().length+' placed on a '+n+'&times;'+n+' board.</p>'+
    '<div class="acts"><button class="btn" data-act="close">Keep going</button>'+
    '<button class="btn" data-act="restart">Clear marks</button>'+
    '<button class="btn primary" data-act="new">New puzzle</button></div>');
};

/* ---------------- input ---------------- */
var press=null,lastTap={i:-1,t:0,was:0},HOLD=430;
function cellFrom(t){var el=t&&t.closest?t.closest(".cell"):null;return el?+el.dataset.i:-1}
function dropUndoFor(i){
  if(undoStack.length&&undoStack[undoStack.length-1][0]===i) undoStack.pop();
}
function putCow(i,rewindTo){
  if(won||lost) return;
  if(rewindTo!==undefined){dropUndoFor(i);marks[i]=rewindTo;}
  if(marks[i]===2){paint();return}
  setMark(i,2);buzz(14);
  var cows=cowList(),foe=-1,k;
  for(k=0;k<cows.length;k++) if(cows[k]!==i&&attacked(cows[k],i)){foe=cows[k];break}
  afterMove();
  if(foe>=0) strike(i,foe);
  else if(sol[(i/n)|0]!==(i%n)) strike(i,-1);
}
boardEl.addEventListener("contextmenu",function(e){e.preventDefault()});
boardEl.addEventListener("pointerdown",function(e){
  if(won||lost) return;
  var i=cellFrom(e.target);
  if(i<0) return;
  cursor=i;
  var p={i:i,x:e.clientX,y:e.clientY,id:e.pointerId,moved:false,fired:false,from:marks[i],pushed:false,last:i};
  press=p;
  if(marks[i]===0){setMark(i,1);p.pushed=true;afterMove();}
  else paint();
  p.timer=setTimeout(function(){
    if(press!==p||p.moved||p.fired) return;
    p.fired=true;
    putCow(i,p.pushed?p.from:undefined);
  },HOLD);
  try{boardEl.setPointerCapture(e.pointerId)}catch(err){}
  e.preventDefault();
},{passive:false});
boardEl.addEventListener("pointermove",function(e){
  if(!press||won||lost||e.pointerId!==press.id) return;
  if(!press.moved&&(Math.abs(e.clientX-press.x)>8||Math.abs(e.clientY-press.y)>8)){
    press.moved=true;clearTimeout(press.timer);
  }
  if(!press.moved||press.from!==0||press.fired) return;
  var el=document.elementFromPoint(e.clientX,e.clientY),i=cellFrom(el);
  if(i<0||i===press.last) return;
  press.last=i;
  if(marks[i]===0){setMark(i,1);cursor=i;afterMove();}
},{passive:true});
function endPress(){
  if(!press) return;
  var p=press;press=null;clearTimeout(p.timer);
  if(p.fired||p.moved){lastTap.i=-1;return}
  var now=Date.now();
  if(lastTap.i===p.i&&now-lastTap.t<330){
    var was=lastTap.was;lastTap.i=-1;
    putCow(p.i,was);
    return;
  }
  lastTap={i:p.i,t:now,was:p.from};
  if(p.from!==0){setMark(p.i,0);afterMove();}
}
window.addEventListener("pointerup",endPress);
window.addEventListener("pointercancel",function(){if(press){clearTimeout(press.timer);press=null}});

boardEl.addEventListener("keydown",function(e){
  var k=e.key;
  if(cursor<0) cursor=0;
  var r=(cursor/n)|0,c=cursor%n,moved=true;
  if(k==="ArrowUp") r=Math.max(0,r-1);
  else if(k==="ArrowDown") r=Math.min(n-1,r+1);
  else if(k==="ArrowLeft") c=Math.max(0,c-1);
  else if(k==="ArrowRight") c=Math.min(n-1,c+1);
  else moved=false;
  if(moved){cursor=idx(r,c);paint();e.preventDefault();return}
  if(k===" "){setMark(cursor,marks[cursor]?0:1);afterMove();e.preventDefault()}
  else if(k==="Enter"){putCow(cursor);e.preventDefault()}
});

/* ---------------- boot ---------------- */
function start(){
  $("#logo").innerHTML=cowSVG();
  var s=load();
  if(s){
    n=s.n;reg=s.reg;sol=s.sol;marks=s.marks||new Array(n*n).fill(0);
    colorOf=s.colorOf||Array.from({length:n},function(_,i){return i});
    elapsed=s.elapsed||0;hints=s.hints||0;won=!!s.won;lost=!!s.lost;strikes=s.strikes||0;
    stats=s.stats||{best:{},solved:0};
    prog=s.prog||{star:{},best:{}};
    if(!prog.star)prog.star={};if(!prog.best)prog.best={};if(!prog.rec)prog.rec={};
    mode=s.mode==="level"?"level":"free";level=typeof s.level==="number"?s.level:-1;
    if(mode==="level"&&(level<0||level>=LEVELS.length)){mode="free";level=-1}
    buildBoard();paintSizes();paintChrome();layout();paint();
    if(lost) setTimeout(loseGame,300);
    if(!won&&!lost) runTimer(true);
    if(!lost) setTimeout(newsCard,420);
  }else{
    paintSizes();paintChrome();
    newPuzzle(8);
    setTimeout(function(){
      modal('<h2>How Trixdoku works</h2><ul class="rules">'+
        '<li>One Trix in every coloured field.</li>'+
        '<li>One Trix in every row and every column.</li>'+
        '<li>No two of them touching &mdash; not even corner to corner.</li>'+
        '<li>Put Trix anywhere she does not belong and it costs a life. Three and the round is over.</li>'+
        '<li>Tap a square to rule it out. Hold it, or double-tap, to place Trix there.</li>'+
        '</ul><div class="acts"><button class="btn primary" data-act="close">Free play</button><button class="btn" data-act="levels">Levels</button></div>');
    },420);
  }
  startLeaderboard();
  startAccount();
  window.addEventListener("resize",layout);
  if(window.visualViewport) window.visualViewport.addEventListener("resize",layout);
  setTimeout(layout,150);
  document.addEventListener("visibilitychange",function(){
    if(document.hidden){runTimer(false);save()} else if(!won&&!lost) runTimer(true);
  });
  try{
    if(window.claude&&window.claude.hot&&window.claude.hot.snapshot)
      window.claude.hot.snapshot(function(){return {v:1}});
  }catch(e){}
}
start();
})();
</script>
